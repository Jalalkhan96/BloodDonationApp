name: lifelink
description: "LifeLink — Smart Blood Donation Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.16
  lottie: ^3.3.1
  fl_chart: ^0.70.2
  percent_indicator: ^4.2.3

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # DI
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.1
  firebase_messaging: ^15.2.1
  firebase_analytics: ^11.4.1
  firebase_crashlytics: ^4.3.1
  firebase_remote_config: ^5.2.1
  firebase_app_check: ^0.3.2+1
  google_sign_in: ^6.1.0

  # Functional Programming
  fpdart: ^1.0.0

  # Code Generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.8.1
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  injectable_generator: ^2.4.4

  # Location
  google_maps_flutter: ^2.12.1
  geolocator: ^14.0.0
  geocoding: ^4.0.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4

  # Image/Media
  image_picker: ^1.1.2
  image_cropper: ^9.0.0
  flutter_image_compress: ^2.3.4

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2

  # Notifications
  flutter_local_notifications: ^18.0.1

  # PDF
  pdf: ^3.11.2
  printing: ^5.13.4

  # Network
  connectivity_plus: ^6.1.3
  dio: ^5.8.0+1

  # Utils
  uuid: ^4.5.1
  intl: ^0.20.2
  equatable: ^2.0.7
  collection: ^1.19.1
  string_similarity: ^2.0.1
  # Geohash computed in LocationService

  # Permissions
  permission_handler: ^11.4.0

  # URL
  url_launcher: ^6.3.1

  # Share
  share_plus: ^10.1.4

  # Clipboard
  # (uses flutter services built-in clipboard)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  fake_async: ^1.3.2
  golden_toolkit: ^0.15.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
